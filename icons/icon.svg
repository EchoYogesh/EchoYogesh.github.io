<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#781c2b"/>
      <stop offset="50%" stop-color="#54111d"/>
      <stop offset="100%" stop-color="#20040a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceda9"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa7c11"/>
      <stop offset="100%" stop-color="#f3d775"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Ornate Outer Gold Border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.9"/>
  <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.5" stroke-dasharray="6,6"/>

  <!-- Corner Ornamental Dots -->
  <circle cx="50" cy="50" r="6" fill="url(#gold)"/>
  <circle cx="462" cy="50" r="6" fill="url(#gold)"/>
  <circle cx="50" cy="462" r="6" fill="url(#gold)"/>
  <circle cx="462" cy="462" r="6" fill="url(#gold)"/>

  <!-- Center Auspicious Shri Mantra -->
  <text x="256" y="145" text-anchor="middle" fill="url(#gold)" font-family="'Noto Serif Devanagari', 'Cinzel', serif" font-size="36" font-weight="bold" letter-spacing="4">॥ श्री ॥</text>

  <!-- Decorative Separator Line -->
  <path d="M176 175 C216 170 236 180 256 175 C276 170 296 180 336 175" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.75"/>
  <polygon points="256,170 260,175 256,180 252,175" fill="url(#gold)"/>

  <!-- Monogram B & S -->
  <text x="256" y="295" text-anchor="middle" fill="url(#gold)" font-family="'Playfair Display', 'Cinzel Decorative', 'Georgia', serif" font-size="120" font-weight="bold" font-style="italic">B&amp;S</text>

  <!-- Subtitle Text -->
  <text x="256" y="365" text-anchor="middle" fill="#f5ecd7" font-family="'Cinzel', 'Playfair Display', serif" font-size="24" font-weight="600" letter-spacing="6">WEDDING</text>
  <text x="256" y="405" text-anchor="middle" fill="url(#gold)" font-family="'Cinzel', 'Georgia', serif" font-size="16" letter-spacing="8" opacity="0.9">CHANDAUKA · 2027</text>

  <!-- Bottom Sacred Lotus Flourish -->
  <path d="M240 435 C248 422 256 420 256 420 C256 420 264 422 272 435 C264 433 256 430 256 430 C256 430 248 433 240 435 Z" fill="url(#gold)"/>
</svg>
